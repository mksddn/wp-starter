name: ${REPOSITORY_NAME}
services:
  wordpress:
    image: wordpress:7.0.2-php8.4-apache
    container_name: "${REPOSITORY_NAME}_wordpress"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 0.0.0.0:${WORDPRESS_PORT}:80
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}:${DB_PORT}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - ../.srv/wordpress/:/var/www/html
      - ../.srv/log/:/var/log
      - ../wp-content:/var/www/html/wp-content
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

  wpcli:
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    image: wordpress:cli-2.12.0-php8.4
    container_name: "${REPOSITORY_NAME}_wpcli"
    entrypoint: wp
    command: "--info"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}:${DB_PORT}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - ../.srv/wordpress/:/var/www/html
      - ../.srv/log/:/var/log
      - ../wp-content:/var/www/html/wp-content
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini

  mysql:
    image: mariadb:10.5.8
    container_name: "${REPOSITORY_NAME}_mysql"
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    volumes:
      - ../.srv/database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: "${REPOSITORY_NAME}_phpmyadmin"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PHPMYADMIN_PORT}:80
    environment:
      PMA_HOST: ${DB_HOST}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}